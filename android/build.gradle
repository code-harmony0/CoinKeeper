buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath 'com.google.gms:google-services:4.4.3'
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// Force all native modules to use the project's NDK version.
// Some libraries (e.g. op-sqlite) don't set ndkVersion and fall back to
// AGP's default NDK, which may not be installed (or may be corrupt).
// Must be registered BEFORE the react rootproject plugin, which eagerly
// evaluates subprojects.
subprojects { subproject ->
    subproject.afterEvaluate {
        if (subproject.hasProperty("android")) {
            subproject.android.ndkVersion = rootProject.ext.ndkVersion
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
